# =============================================================================
# App « Création de BL » — toute la configuration est ici (ni bundle, ni secret).
#
# NON déclaré ici, car injecté automatiquement par Databricks Apps :
#   * PGHOST / PGPORT / PGDATABASE / PGUSER / PGSSLMODE -> ressource Database
#     (Lakebase), à ajouter dans Edit ▸ Resources avec la clé « postgres » ;
#   * l'identité SSO de l'utilisateur (en-têtes HTTP).
# =============================================================================
command: ["streamlit", "run", "app.py", "--server.headless=true"]
env:
  - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
    value: "false"

  # --- Environnement et sécurité ---------------------------------------------
  # prod : RBAC obligatoire et traces techniques masquées à l'utilisateur.
  - name: BL_ENVIRONMENT
    value: "prod"
  - name: BL_RBAC_MODE
    value: "strict"
  # Administrateurs de secours (e-mails séparés par des virgules) : ils gardent
  # l'accès même si la table des rôles est vide. À vider une fois les rôles
  # attribués dans l'app Administration.
  - name: BL_BOOTSTRAP_ADMINS
    value: "younes.elhachi1@emotors.com"

  # --- Base de données --------------------------------------------------------
  - name: BL_PG_SCHEMA
    value: "bl_demat"
  - name: BL_TIMEZONE
    value: "Europe/Paris"

  # --- Documents scannés (stockés en base, colonne BYTEA) ---------------------
  - name: BL_MAX_IMAGE_BYTES
    value: "4194304"        # 4 Mo par page
  - name: BL_MAX_TOTAL_BYTES
    value: "52428800"       # 50 Mo par BL
  - name: BL_MAX_PAGES
    value: "20"
  - name: BL_MAX_DIMENSION_PX
    value: "3508"

  # --- Extraction IA ----------------------------------------------------------
  # Endpoint de model serving (vision). Ajouter la ressource « Serving
  # endpoint » à l'app avec la permission « Can query ».
  # Valeur vide = IA désactivée (saisie 100 % manuelle).
  - name: BL_LLM_ENDPOINT
    value: "databricks-claude-opus-4-8"

  # --- Notification Teams : nouvelle réception --------------------------------
  # URL du flux « Workflows » du canal Teams (déclencheur « Lorsqu'une requête
  # webhook Teams est reçue »). Vide = aucune notification envoyée.
  - name: BL_TEAMS_WEBHOOK_RECEPTION
    value: ""
  - name: BL_TEAMS_TIMEOUT_S
    value: "8"
  # Méthode de mention des gestionnaires :
  #   flow  (défaut) l'app envoie les e-mails + le marqueur {{MENTIONS}} ; le
  #         flux Power Automate croise ces e-mails avec les membres de l'équipe
  #         et génère les jetons de mention (voir GUIDE, « Rendre les mentions
  #         cliquables »).
  #   texte noms en clair, sans mention — repli si le flux ne peut pas être
  #         modifié.
  - name: BL_TEAMS_MENTION_MODE
    value: "flow"

